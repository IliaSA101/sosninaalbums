version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Vite закреплён на 7: vite-plugin-svelte 6 не поддерживает Vite 8 (см. README)
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # vite-plugin-svelte 7 требует Vite 8, а Vite закреплён на 7
      - dependency-name: "@sveltejs/vite-plugin-svelte"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (новый компилятор) пока не поддерживают svelte-check и typescript-eslint, CI падает
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
