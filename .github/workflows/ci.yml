name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Как локально: эталон экспорта сверяет пиксели image/jpeg этой версии Go
          go-version: "1.26.10"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l main.go internal)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: go vet
        # Пакеты — без ./...: тот заходит в frontend/node_modules (npm ci уже выполнен); один шаблон для всех скриптов
        run: go vet . ./internal/...

      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.14.0
          args: . ./internal/...

      - name: go test
        run: go test . ./internal/...

      - name: prettier
        working-directory: frontend
        run: npx prettier --check .

      - name: eslint
        working-directory: frontend
        run: npx eslint . --max-warnings 0

      - name: svelte-check
        working-directory: frontend
        run: npx svelte-check --fail-on-warnings

      - name: vitest
        working-directory: frontend
        run: npx vitest run

      - name: build frontend
        working-directory: frontend
        run: npm run build

      - name: bindings contract
        run: node scripts/bindings-contract.mjs --check

      # Тесты разбора покрытия и release-check; сам release-check без --version сверяет согласованность версий
      - name: тесты скриптов
        run: node --test "scripts/*.test.mjs"

      - name: release-check
        run: node scripts/release-check.mjs

  # Проверка самих workflow: синтаксис, выражения, типы входов; на ubuntu есть shellcheck — им же и run:
  workflows:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
          cache: false

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  # Движок инструкции по установке (029): тесты и пробная сборка docx без pdf
  guide:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: зависимости (по хешам)
        run: python -m pip install --require-hashes -r scripts/guide/requirements.txt

      # ffmpeg нужен TestRender, иначе тест пропускается
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: тесты
        run: python -I -m unittest discover -s scripts/guide -v

      # Упаковка архивов выпуска (039): stdlib, синтетические exe и .app-zip
      - name: тесты упаковки выпуска
        run: python -I -m unittest discover -s scripts/win -v

      - name: пробная сборка docx
        run: |
          for v in "" win macos; do
            python -I scripts/guide/build_docx.py docs/install/guide.md ${v:+--variant "$v"} --out "$RUNNER_TEMP/guide"
          done

  # Помощники снимков для Mac (029/036): чистые функции без macOS; bash — тот же язык, что на раннере Mac
  mac-scripts:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pillow не ставим: тесты, которым он нужен, пропускаются сами
      - name: тесты macshots.py
        run: python -I -m unittest discover -s scripts/mac -v

      - name: тесты lib.sh
        run: bash scripts/mac/test_lib.sh
