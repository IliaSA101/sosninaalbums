# Проверка Mac-сборки и снимки для инструкции по кнопке (спека 029, design §3.7).
# Берёт zip опубликованного релиза (tag) или артефакт «macos» прогона Release (run_id, для черновика).
# Раннеры по умолчанию — все три версии macOS, для каждой свой файл инструкции: 26 (Tahoe), 15 (Sequoia),
# 14 (Sonoma; его шаги верны и для 12 Monterey, 13 Ventura). Intel-образы не нужны: экраны те же.
# Скрипты — из того же коммита, что этот файл: итерация = правка scripts/mac → коммит в main → новый прогон.
name: "Mac: снимки и проверка"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Метка опубликованного релиза, например v0.9.1 (пусто — последний релиз, иначе последний прогон Release)"
        required: false
        type: string
        default: ""
      run_id:
        description: "Номер прогона Release с артефактом macos (пусто — см. tag)"
        required: false
        type: string
        default: ""
      runners:
        description: "Раннеры"
        required: true
        type: choice
        default: "macos-26,macos-15,macos-14"
        options:
          - "macos-26,macos-15,macos-14"
          - "macos-26,macos-15"
          - "macos-26"
          - "macos-15"
          - "macos-14"
          - "macos-26-intel"
      lang:
        description: "Язык интерфейса Mac"
        required: true
        type: choice
        default: ru
        options: [ru, en]
      video:
        description: "Пробовать видео"
        required: true
        type: boolean
        default: true
      guide_video:
        description: "Ролик-инструкция (036): сырая запись video/raw.mp4 и журнал video/steps.jsonl для монтажа overlay.py; +3–4 мин на раннер"
        required: true
        type: boolean
        default: true
      scenes:
        description: "Главы ролика (039): all — «Распакуйте архив», «Первый запуск», «Если пишет «повреждено»»; unzip — только распаковка; classic — как 0.10 (программа сразу в «Программах»)"
        required: true
        type: choice
        default: all
        options: [all, unzip, classic]
      display:
        description: "Экран раннера: auto (1440x900:hidpi, 1920x1080, 1680x1050, 1440x900) или свой список ШxВ[:hidpi]"
        required: false
        type: string
        default: auto
      selftest:
        description: "crash — испортить бинарь и убедиться, что проверка падает"
        required: true
        type: choice
        default: none
        options: [none, crash]

# Только чтение: релиз и артефакты; секретов нет
permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  pick:
    name: Входы
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      run_id: ${{ steps.pick.outputs.run_id }}
      runners: ${{ steps.pick.outputs.runners }}
    steps:
      - name: Ровно один источник zip, список раннеров
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RUN_ID: ${{ inputs.run_id }}
          RUNNERS: ${{ inputs.runners }}
        run: |
          if [ -n "$TAG" ] && [ -n "$RUN_ID" ]; then
            echo "::error::Задайте tag или run_id, не оба"
            exit 1
          fi
          # Входы по умолчанию (пустые): последний опубликованный релиз, иначе последний успешный прогон Release
          if [ -z "$TAG" ] && [ -z "$RUN_ID" ]; then
            TAG="$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty' || true)"
            if [ -z "$TAG" ]; then
              RUN_ID="$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
            fi
            echo "Вход по умолчанию: tag='$TAG' run_id='$RUN_ID'"
          fi
          if [ -n "$TAG" ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag должен быть vX.Y.Z, получено '$TAG'"; exit 1; }
          elif [ -n "$RUN_ID" ]; then
            [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id — число, получено '$RUN_ID'"; exit 1; }
            # Артефакт «macos»/«windows» берём только из прогона Release по метке или ручному запуску:
            # чужой workflow мог бы выложить под этим именем что угодно
            info="$(gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json workflowName,event,headBranch --jq '.workflowName + "|" + .event + "|" + .headBranch')" ||
              { echo "::error::Прогон $RUN_ID не найден"; exit 1; }
            case "$info" in
              "Release|workflow_dispatch|main") ;;
              "Release|push|"*)
                [[ "${info#Release|push|}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
                  { echo "::error::Прогон $RUN_ID — ветка не метка версии: '$info'"; exit 1; } ;;
              *) echo "::error::Прогон $RUN_ID — '$info', нужен Release (push по метке или workflow_dispatch с main)"; exit 1 ;;
            esac
          else
            echo "::error::Нужен tag (опубликованный релиз) или run_id (прогон Release)"
            exit 1
          fi
          IFS=, read -ra list <<< "$RUNNERS"
          for r in "${list[@]}"; do
            [[ "$r" =~ ^macos-(26|15|14|26-intel)$ ]] || { echo "::error::Неизвестный раннер '$r'"; exit 1; }
          done
          {
            echo "tag=$TAG"
            echo "run_id=$RUN_ID"
            echo "runners=$(printf '%s\n' "${list[@]}" | jq -R . | jq -sc .)"
          } >> "$GITHUB_OUTPUT"

  check:
    name: Mac ${{ matrix.runner }}
    needs: pick
    strategy:
      # macos-14 выводят из работы (с 16.10.2026 бывает недоступен) — остальные раннеры идут дальше
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.pick.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Тесты помощников (bash 3.2 системы, Python)
        continue-on-error: true
        run: |
          /bin/bash scripts/mac/test_lib.sh
          python3 -m unittest discover -s scripts/mac -v

      # Архив выпуска (039 design §5.1): упакован по раскладке «Sosnina Albums X.Y.Z/…» — берём как есть (check = 0);
      # «голый» zip выпуска 0.10 (.app в корне, check = 3) пакуем сами через pack.py — на нём снимается глава
      # «Распакуйте архив». pack.py пишет Т1 (scripts/win), вызов — по контракту design §2.1
      - name: zip программы
        id: zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.pick.outputs.tag }}
          RUN_ID: ${{ needs.pick.outputs.run_id }}
        run: |
          d="$RUNNER_TEMP/zip"
          mkdir -p "$d"
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*-macos-universal.zip' -D "$d"
          else
            gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n packages -D "$d" ||
              gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n macos -D "$d"
          fi
          shopt -s nullglob
          zips=("$d"/*-macos-universal.zip "$d"/*-macos-app.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Ожидался один архив macOS (*-macos-universal.zip), найдено: ${#zips[@]}"
            ls -l "$d"
            exit 1
          fi
          zip="${zips[0]}"
          rc=0
          python3 -I scripts/win/pack.py check "$zip" --os macos || rc=$?
          if [ "$rc" = 3 ]; then
            ver="$(basename "$zip" | sed -n 's/^SosninaAlbums-\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)-macos.*\.zip$/\1/p')"
            [ -n "$ver" ] || ver="${TAG#v}"
            [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Версию не определить: zip '$zip', tag '$TAG'"; exit 1; }
            # Инструкция: pdf выпуска, иначе docx, иначе заглушка (в архиве снимков важна раскладка, не текст)
            g="$RUNNER_TEMP/guide"
            mkdir -p "$g"
            if [ -n "$TAG" ]; then
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*-install-guide-ru.pdf' -D "$g" 2>/dev/null ||
                gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*-install-guide-ru.docx' -D "$g" 2>/dev/null || true
            fi
            guides=("$g"/*.pdf "$g"/*.docx)
            if [ "${#guides[@]}" -eq 0 ]; then
              echo "::warning::Инструкции выпуска нет — в архив снимков кладётся заглушка"
              echo "Заглушка инструкции для снимков." > "$g/install-guide-ru.docx"
              guides=("$g/install-guide-ru.docx")
            fi
            out="$RUNNER_TEMP/packed"
            mkdir -p "$out"
            python3 -I scripts/win/pack.py macos --app-zip "$zip" --version "$ver" --guide "${guides[0]}" \
              --changelog CHANGELOG.md --notices THIRD_PARTY_NOTICES.txt --license LICENSE --notice NOTICE.md --out "$out" | tee "$RUNNER_TEMP/pack.log"
            zip="$(tail -n 1 "$RUNNER_TEMP/pack.log")"
            [ -f "$zip" ] || { echo "::error::pack.py не назвал архив: '$zip'"; exit 1; }
            python3 -I scripts/win/pack.py check "$zip" --os macos --version "$ver"
            echo "Архив упакован для снимков: $(basename "$zip")"
          elif [ "$rc" != 0 ]; then
            echo "::error::pack.py check: код $rc — архив не годится"
            exit 1
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          ls -l "$(dirname "$zip")"

      # Провал валит задание — так selftest проверяет, что сломанный бинарь не пройдёт
      - name: Проверка запуска (smoke.sh)
        env:
          ZIP: ${{ steps.zip.outputs.zip }}
          MAC_SMOKE_SELFTEST: ${{ inputs.selftest }}
        run: |
          [ "$MAC_SMOKE_SELFTEST" = "crash" ] || unset MAC_SMOKE_SELFTEST
          /bin/bash scripts/mac/smoke.sh "$ZIP" "$RUNNER_TEMP/mac-out"

      - name: Снимки и видео (shots.sh)
        if: always() && steps.zip.outcome == 'success'
        env:
          ZIP: ${{ steps.zip.outputs.zip }}
          LANG_UI: ${{ inputs.lang }}
          VIDEO: ${{ inputs.video }}
          GUIDE_VIDEO: ${{ inputs.guide_video }}
          SCENES: ${{ inputs.scenes }}
          DISPLAY_SPEC: ${{ inputs.display }}
        run: |
          args=(--lang "$LANG_UI" --display "${DISPLAY_SPEC:-auto}")
          [ "$VIDEO" = "true" ] && args+=(--video)
          [ "$GUIDE_VIDEO" = "true" ] && args+=(--guide-video --scenes "${SCENES:-all}")
          /bin/bash scripts/mac/shots.sh "$ZIP" "$RUNNER_TEMP/mac-out" "${args[@]}"

      - name: Сводка
        if: always()
        run: |
          f="$RUNNER_TEMP/mac-out/summary.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "summary.md нет" >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mac-shots-${{ matrix.runner }}
          path: ${{ runner.temp }}/mac-out/
          if-no-files-found: warn
          retention-days: 14
