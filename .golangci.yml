  exclusions:
    generated: lax
    paths:
      - frontend
      - build
      - .gotmp
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          # табличные и свойственные тестам длинные функции; сложность (gocognit) в тестах проверяется
          - funlen
      - path: internal/testkit/
        linters:
          - gosec # генератор тестовых файлов, в продукт не попадает
      # Пределы funlen/gocognit: существующие нарушения на 2026-10-09 (замер при lines 80 /
      # statements 50 / cognitive 30). Список только сокращается; новые функции в него не вносить.
      # Разрез перенесён на 0.9 (спека 023 «Не входит», BACKLOG «Сводное ревью 0.8.0»); строки удалять по мере разреза.
      # funlen пишет «Function 'имя' …», gocognit — «of func `(*Тип).имя`».
      - path: internal/app/exporter/export\.go
        linters: [funlen, gocognit]
        text: "Function 'Export' |func `\\(\\*Service\\)\\.Export`"
      # 023: шаблоны верны и до переноса, и после (R3, экспорт ClampGrid, новые файлы, album) — design §5
      - path: internal/album/editor\.go
        linters: [funlen]
        text: "Function 'edit' "
      - path: internal/album/
        linters: [funlen, gocognit]
        text: "Function 'copyGrid' |func `(\\(\\*Project\\)\\.)?copyGrid`"
      - path: internal/album/
        linters: [gocognit]
        text: "func `\\(\\*Project\\)\\.(clampGrid|ClampGrid)`"
      # Тесты: циклы-свойства, фаззинг и таблицы с вложенными проверками сложны по природе;
      # те же условия — до 023 (0.8.0).
      - path: internal/app/api_test\.go
        linters: [gocognit]
        text: "func `TestRescanGeneration`"
      - path: internal/render/render_rotplace_test\.go
        linters: [gocognit]
        text: "func `(TestRenderContainTiltMask|TestRenderPlaceRot)`"
      - path: internal/album/.*_test\.go
        linters: [gocognit]
        text: "func `(TestGridInvariants|TestLoadV4Dev|FuzzLoad|TestPlaceBoxes)`"
      # 023 Ш2: помощники тестов переехали из _test.go в edtest без правки тел (rw verify); сообщения
      # инвариантов начинаются с имени поля («Order …») — для тестов ST1005 и раньше не действовал.
      - path: internal/album/internal/edtest/
        linters: [staticcheck]
        text: "ST1005"
      # 023 Ш4з: правки модели мимо Editor — только в дереве альбома (forbidigo, msg правила)
      - path: internal/album/
        linters: [forbidigo]
        text: "правка модели мимо Editor"
      - path: _test\.go
        linters: [forbidigo]
        text: "крючок теста"
      # 067: сам клиент; тесты ходят в свой httptest-сервер
      - path: (internal/decor/fetch/|_test\.go)
        linters: [forbidigo]
        text: "сетевой клиент"
      # quietTransport глушит keep-alive общего транспорта для прокси wails dev — настройка, не запрос в сеть
      - path: internal/app/app\.go
        linters: [forbidigo]
        text: "сетевой клиент"
      # 110: правило os.Stat — только для internal/app (остальные 19 файлов — позже); тесты пакета свободны
      - path-except: ^internal/app/
        linters: [forbidigo]
        text: "110: os.Stat"
      - path: internal/app/.*_test\.go
        linters: [forbidigo]
        text: "110: os.Stat"
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - frontend
      - build
      - .gotmp

issues:
  # funlen и gocognit стоят на одной строке (объявлении функции): без этого один скрывает другого
  uniq-by-line: false
