            - github.com/IliaSA101/sosninaalbums/internal/album/design
            - github.com/IliaSA101/sosninaalbums/internal/album/model
            - github.com/IliaSA101/sosninaalbums/internal/geom
            - github.com/IliaSA101/sosninaalbums/internal/layout
            - github.com/IliaSA101/sosninaalbums/internal/text
            - github.com/IliaSA101/sosninaalbums/internal/library
            - github.com/IliaSA101/sosninaalbums/internal/paths
            - github.com/IliaSA101/sosninaalbums/internal/album$
            - github.com/IliaSA101/sosninaalbums/internal/album/internal/edtest
            - github.com/IliaSA101/sosninaalbums/internal/testkit
        "album/layers: только model":
          files:
            - "**/internal/album/layers/**"
          list-mode: strict
          allow:
            - $gostd
            - github.com/IliaSA101/sosninaalbums/internal/album/layers
            - github.com/IliaSA101/sosninaalbums/internal/album/model
            - github.com/IliaSA101/sosninaalbums/internal/geom
            - github.com/IliaSA101/sosninaalbums/internal/layout
            - github.com/IliaSA101/sosninaalbums/internal/text
            - github.com/IliaSA101/sosninaalbums/internal/library
            - github.com/IliaSA101/sosninaalbums/internal/paths
            - github.com/IliaSA101/sosninaalbums/internal/album$
            - github.com/IliaSA101/sosninaalbums/internal/album/internal/edtest
            - github.com/IliaSA101/sosninaalbums/internal/testkit
        "album/backdrop: только model":
          files:
            - "**/internal/album/backdrop/**"
          list-mode: strict
