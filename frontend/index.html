<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <!-- CSP: ничего внешнего, скриптов нет кроме собственных; style-src 'unsafe-inline' нужен Svelte (style:-директивы и style=""). connect-src для WebSocket и worker-src blob: (SharedWorker клиента HMR при разрыве связи) — только dev-сервер: в выпускной сборке vite.config.ts (releaseCsp) их вырезает. media-src 'self' blob: — окно ролика справочника F1 играет скачанный fetch-ом Blob (<video src> на /media/ в WebKitGTK не играет, 0.30-140-19); раньше media-src падал на default-src 'self', blob: — минимальное ослабление, внешних адресов нет. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self' blob:"
    />
    <title>Sosnina Albums</title>
  </head>
  <body>
    <div id="app"></div>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>
